services:
  app:
    image: node:24-bookworm-slim
    working_dir: /app
    command: sh -c "npm install --maxsockets=1 --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000 && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - /home/user/repo:/app
      - app_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - NODE_OPTIONS=--max-old-space-size=1024
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5173', r => process.exit(r.statusCode<500?0:1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
volumes:
  app_node_modules:
